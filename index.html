<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根星图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f6f4f0;
    font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'PingFang SC', serif;
    height: 100dvh; width: 100vw;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    cursor: default;
    /* 安全区适配刘海屏 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .page { position: fixed; inset: 0; transition: opacity 0.4s, transform 0.4s; }
  .page.hidden { opacity: 0; pointer-events: none; }

  /* ============ 主页：星座背诵页 ============ */
  #home {
    display: flex; align-items: center; justify-content: center;
    z-index: 5; background: #f6f4f0;
  }

  .home-scene { position: relative; width: 100vw; height: 100dvh; transition: opacity 0.35s; }
  .home-scene.fading { opacity: 0; }

  .h-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 10; cursor: pointer;
    /* 增大移动端触摸区 */
    padding: 16px;
  }
  .h-center .root {
    font-size: clamp(28px, 8vw, 38px); font-weight: 700;
    color: #1c1c1e; letter-spacing: 3px; line-height: 1;
  }
  .h-center .sub {
    font-size: clamp(13px, 3.5vw, 16px); color: #aaa49c;
    letter-spacing: 1.5px; margin-top: 2px;
  }
  .h-center .meaning {
    font-size: clamp(10px, 2.6vw, 12px); color: #b0a89e;
    margin-top: 8px; letter-spacing: 1px; font-style: italic;
  }
  .h-center .toggle-hint {
    font-size: 10px; color: #d0cbc2; margin-top: 6px; letter-spacing: 0.5px;
    opacity: 0; transition: opacity 0.4s;
  }
  .h-center:hover .toggle-hint { opacity: 1; }

  .h-word {
    position: absolute; z-index: 6;
    transform: translate(-50%, -50%);
    text-align: center; cursor: pointer;
    pointer-events: auto;
    /* 移动端触摸区 */
    padding: clamp(6px, 2vw, 10px) clamp(8px, 2.5vw, 12px);
  }
  .h-word .dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: #c8c4ba; margin: 0 auto 7px; transition: all 0.3s;
  }
  .h-word.expanded .dot,
  .h-word:hover .dot { background: #a09888; }

  .h-word .text { font-size: clamp(11px, 3vw, 14px); letter-spacing: 0.2px; white-space: nowrap; }
  .h-word .text .black { color: #1c1c1e; }
  .h-word .text .red   { color: #c06b50; }

  .h-word .zh {
    font-size: clamp(9px, 2.2vw, 10px); color: #b0a89e;
    margin-top: 1px; letter-spacing: 0.3px;
    opacity: 0; max-height: 0; overflow: hidden; transition: all 0.35s;
  }
  .h-word.expanded .zh { opacity: 1; max-height: 20px; }

  svg.h-lines {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
  }
  svg.h-lines line { stroke: #dad6cc; stroke-width: 0.5; transition: stroke 0.35s; }
  svg.h-lines line.hl { stroke: #a09888; stroke-width: 0.7; }

  /* 底部词根切换条 */
  .root-switcher {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 50%; transform: translateX(-50%);
    display: flex; gap: clamp(8px, 2vw, 14px); align-items: center;
    z-index: 20;
  }
  .root-switcher .rs-arrow {
    font-size: clamp(16px, 4vw, 18px); color: #a09888; cursor: pointer;
    padding: clamp(6px, 2vw, 10px); transition: color 0.2s;
    /* 确保可触摸 */
    min-width: 40px; min-height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .root-switcher .rs-arrow:hover { color: #5b4a3f; }

  /* 房子按钮 */
  .house-btn {
    width: clamp(36px, 10vw, 40px); height: clamp(36px, 10vw, 40px);
    border-radius: 12px;
    background: #faf9f6; border: 0.8px solid #d5d1c8;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 5vw, 20px); cursor: pointer;
    transition: all 0.25s; flex-shrink: 0;
  }
  .house-btn:hover { background: #f0ede8; border-color: #a09888; }
  .house-btn:active { transform: scale(0.93); }

  /* 完成复习按钮（右上角） */
  .review-done-btn {
    position: fixed;
    top: max(14px, env(safe-area-inset-top, 14px));
    right: max(14px, env(safe-area-inset-right, 14px));
    padding: clamp(8px, 2vw, 10px) clamp(14px, 3.5vw, 18px);
    border-radius: 16px;
    border: 0.5px solid #d5d1c8;
    background: #faf9f6; color: #5b4a3f;
    font-size: clamp(10px, 2.5vw, 11px); cursor: pointer;
    font-family: 'Georgia','PingFang SC',serif;
    letter-spacing: 0.8px; transition: all 0.2s;
    z-index: 25;
  }
  .review-done-btn:hover { background: #f0ede8; border-color: #a09888; }

  /* ============ 仪表盘页 ============ */
  #dashboard {
    display: flex; flex-direction: column;
    z-index: 10; padding: 16px 0 0 0; background: #f6f4f0;
  }

  .dash-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px clamp(16px, 4vw, 24px); z-index: 3; flex-shrink: 0;
  }
  .dash-top .title {
    font-size: clamp(14px, 3.8vw, 16px); font-weight: 600;
    color: #3a302a; letter-spacing: 1.5px;
  }
  .dash-top .date {
    font-size: clamp(9px, 2.2vw, 10px); color: #c4bfb4; letter-spacing: 0.5px;
  }

  .stats-row {
    display: flex; gap: clamp(8px, 2vw, 12px);
    padding: 0 clamp(12px, 3vw, 24px); z-index: 3;
    flex-shrink: 0; margin-bottom: 8px;
  }
  .stat-card {
    flex: 1; background: #fdfdfb;
    border-radius: 14px; padding: clamp(10px, 2.5vw, 14px) clamp(12px, 3vw, 18px);
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-card .val {
    font-size: clamp(18px, 4.5vw, 22px); font-weight: 700; color: #2c2822;
    letter-spacing: -0.3px;
  }
  .stat-card .val.urgent { color: #c06b50; }
  .stat-card .lbl {
    font-size: clamp(9px, 2vw, 10px); color: #b8b0a6; letter-spacing: 0.5px;
  }

  .chart-wrap {
    flex: 1; position: relative; min-height: 0;
    margin: 0 clamp(8px, 2vw, 16px) 12px;
    background: #fdfdfb;
    border-radius: 20px;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.05), 0 2px 16px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .chart-wrap svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .chart-dots {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
  }

  /* 小号词根圆（仪表盘用，移动端放大） */
  .small-dot {
    position: absolute; z-index: 10;
    width: clamp(26px, 7vw, 34px); height: clamp(26px, 7vw, 34px);
    border-radius: 50%;
    background: #faf9f6;
    border: 1px solid #cfcbc2;
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    pointer-events: auto;
    font-size: clamp(9px, 2.2vw, 10px); font-weight: 700;
    color: #2c2822; letter-spacing: 0.8px;
  }
  .small-dot:hover {
    transform: translate(-50%, -50%) scale(1.15);
    border-color: #8c8276;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    z-index: 25;
  }
  .small-dot.warning {
    border-color: #c06b50;
    background: #fefaf8;
  }

  .close-dash {
    position: fixed;
    top: max(14px, env(safe-area-inset-top, 14px));
    right: max(14px, env(safe-area-inset-right, 14px));
    z-index: 30;
    width: clamp(32px, 8vw, 36px); height: clamp(32px, 8vw, 36px);
    border-radius: 50%;
    border: 0.5px solid #d5d1c8;
    background: #faf9f6; color: #6b6058;
    font-size: clamp(14px, 3.5vw, 16px); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .close-dash:hover { background: #f0ede8; }
</style>
</head>
<body>

<!-- ==================== 主页：星座背诵 ==================== -->
<div class="page" id="home">
  <div class="home-scene" id="homeScene">
    <svg class="h-lines" id="hLines"></svg>
    <div class="h-center" id="hCenter"></div>
    <div id="hWords" style="position:absolute;inset:0;z-index:6;pointer-events:none;"></div>
  </div>

  <div class="root-switcher" id="rootSwitcher"></div>
  <button class="review-done-btn" id="homeDoneBtn">完成复习 ✓</button>
</div>

<!-- ==================== 仪表盘 ==================== -->
<div class="page hidden" id="dashboard">
  <button class="close-dash" id="closeDash">✕</button>
  <div class="dash-top">
    <span class="title">记忆仪表盘</span>
    <span class="date" id="dateDisplay"></span>
  </div>

  <div class="stats-row">
    <div class="stat-card"><span class="val" id="statTotal">8</span><span class="lbl">词根总数</span></div>
    <div class="stat-card"><span class="val" id="statReviewed">0</span><span class="lbl">今日已复习</span></div>
    <div class="stat-card"><span class="val urgent" id="statUrgent">0</span><span class="lbl">需要复习</span></div>
  </div>

  <div class="chart-wrap" id="chartWrap">
    <svg id="chartSvg"></svg>
    <div class="chart-dots" id="chartDots"></div>
  </div>
</div>
